services:
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: opspilot-chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks: [opspilot-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  opspilot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: opspilot-api
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_MODE: server
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      OPSPILOT_SKILLS_DIR: /app/skills
      EVAL_BASELINE_PATH: /app/data/eval/opspilot_baseline.json
      EVAL_DATASET_PATH: /app/evaluation/datasets/opspilot_eval_200.json
      EVAL_CONCURRENCY: "4"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills:ro
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks: [opspilot-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: opspilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      opspilot:
        condition: service_healthy
    restart: unless-stopped
    networks: [opspilot-network]

networks:
  opspilot-network:
    driver: bridge

volumes:
  chromadb-data:
